name: Android APK

on:
    workflow_dispatch:
    push:
        branches:
            - android-session-parity
        paths:
            - 'android/**'
            - 'shared/fixtures/**'
            - '.github/workflows/android.yml'
            - '.github/scripts/android-signing.py'
            - '.github/scripts/android-signing.test.py'
            - '.github/android-debug-certificate.sha256'
            - '!android/**/*.md'
            - '!android/**/*.mdx'
            - '!shared/fixtures/**/*.md'
            - '!shared/fixtures/**/*.mdx'

permissions:
    contents: read

concurrency:
    group: android-apk
    cancel-in-progress: true

jobs:
    changes:
        if: github.repository == 'drch90/hapi'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            android: ${{ steps.scope.outputs.android }}
            source_sha: ${{ steps.scope.outputs.source_sha }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # The default branch exposes the button; the development branch
                  # contains the current app and all local features.
                  ref: ${{ github.event_name == 'workflow_dispatch' && 'android-session-parity' || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Check signing helper
              run: python3 .github/scripts/android-signing.test.py
            - name: Check Android build inputs
              id: scope
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BEFORE_SHA: ${{ github.event.before }}
              run: |
                  python3 - <<'PY'
                  import os
                  import subprocess

                  head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
                  base = os.environ.get('BEFORE_SHA', '')
                  if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not base.strip('0'):
                      changed = True
                  else:
                      paths = subprocess.check_output(
                          ['git', 'diff', '--name-only', '--no-renames', '-z', base, head],
                      ).decode().split('\0')
                      changed = any(
                          path.startswith(('android/', 'shared/fixtures/'))
                          and not path.lower().endswith(('.md', '.mdx'))
                          for path in paths
                      )
                  value = str(changed).lower()
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write(f'android={value}\nsource_sha={head}\n')
                  print(f'Source: {head}; run Android preflight and APK build: {value}')
                  PY

    build:
        needs: changes
        if: needs.changes.outputs.android == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        defaults:
            run:
                shell: bash
                working-directory: android
        env:
            HAPI_SOURCE_SHA: ${{ needs.changes.outputs.source_sha }}
            HAPI_VERSION_CODE: ${{ github.run_number }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ needs.changes.outputs.source_sha }}
                  persist-credentials: false
            - name: Restore and verify the fixed signing key
              env:
                  HAPI_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.HAPI_ANDROID_DEBUG_KEYSTORE_BASE64 }}
              run: |
                  python3 ../.github/scripts/android-signing.py prepare --keystore "$RUNNER_TEMP/hapi-debug.keystore"
                  printf 'HAPI_ANDROID_DEBUG_KEYSTORE=%s\n' "$RUNNER_TEMP/hapi-debug.keystore" >> "$GITHUB_ENV"
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'
            # The hosted runner supplies the SDK; AGP installs missing build-tools.
            - uses: gradle/actions/setup-gradle@v5
            - name: Compile app, unit tests and instrumentation tests
              run: GITHUB_SHA="$HAPI_SOURCE_SHA" ./gradlew -PhapiVersionCode="$HAPI_VERSION_CODE" :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin --continue --console=plain 2>&1 | tee compile.log
            - name: Protocol, data and app unit tests and lint
              run: GITHUB_SHA="$HAPI_SOURCE_SHA" ./gradlew -PhapiVersionCode="$HAPI_VERSION_CODE" :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --continue --console=plain 2>&1 | tee unit-lint.log
            - name: Assemble the verified debug APK
              run: GITHUB_SHA="$HAPI_SOURCE_SHA" ./gradlew -PhapiVersionCode="$HAPI_VERSION_CODE" :app:assembleDebug --console=plain 2>&1 | tee assemble.log
            - name: Verify APK identity, version and signature
              run: |
                  python3 ../.github/scripts/android-signing.py verify \
                      --apk app/build/outputs/apk/debug/app-debug.apk \
                      --version-code "$HAPI_VERSION_CODE" \
                      --source-sha "$HAPI_SOURCE_SHA" \
                      --report app/build/outputs/apk/debug/signing.json
            - name: Upload the signed APK
              uses: actions/upload-artifact@v6
              with:
                  name: hapi-android-debug-${{ needs.changes.outputs.source_sha }}
                  path: |
                      android/app/build/outputs/apk/debug/app-debug.apk
                      android/app/build/outputs/apk/debug/signing.json
                  if-no-files-found: error
                  retention-days: 7
            - name: Annotate build failures
              if: failure()
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  def escape(value):
                      return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

                  for log in (Path('compile.log'), Path('unit-lint.log'), Path('assemble.log')):
                      if log.exists():
                          for line in log.read_text(errors='replace').splitlines():
                              if line.startswith('e: ') or ' FAILED' in line:
                                  print('::error::' + escape(line))

                  report = Path('app/build/reports/lint-results-debug.xml')
                  if report.exists():
                      findings = []
                      for issue in ET.parse(report).getroot().findall('issue'):
                          if issue.get('severity') not in ('Error', 'Fatal'):
                              continue
                          location = issue.find('location')
                          source = '' if location is None else f"{location.get('file', '')}:{location.get('line', '1')}\n"
                          findings.append(source + f"{issue.get('id', 'Lint')}: {issue.get('message', '')}")
                      if findings:
                          print('::error::' + escape('\n\n'.join(findings)))
                  PY
            - name: Upload unit and lint reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: android-unit-lint-reports
                  path: |
                      android/**/build/reports/tests/
                      android/**/build/test-results/
                      android/app/build/reports/lint-results-debug.*
                      android/*.log
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Remove the runner signing key
              if: always()
              run: rm -f "$RUNNER_TEMP/hapi-debug.keystore"
