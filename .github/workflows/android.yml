name: android

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - android-session-parity
        paths:
            - 'android/**'
            - 'shared/fixtures/**'
            - '.github/workflows/android.yml'
            - '!android/**/*.md'
            - '!android/**/*.mdx'
            - '!shared/fixtures/**/*.md'
    pull_request:
        paths:
            - 'android/**'
            - 'shared/fixtures/**'
            - '.github/workflows/android.yml'
            - '!android/**/*.md'
            - '!android/**/*.mdx'
            - '!shared/fixtures/**/*.md'

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        # Configuration edits can cancel obsolete runs without rebuilding the APK.
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            android: ${{ steps.scope.outputs.android }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Check Android build inputs
              id: scope
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  python3 - <<'PY'
                  import os
                  import subprocess

                  event = os.environ['EVENT_NAME']
                  head = os.environ['HEAD_SHA']
                  base = os.environ['BASE_SHA' if event == 'pull_request' else 'BEFORE_SHA']
                  # A push can explicitly defer Android verification with the
                  # commit trailer "Skip-Android-CI: true". PR/manual checks keep their gates.
                  skip_requested = event == 'push' and subprocess.check_output(
                      ['git', 'log', '-1', '--format=%(trailers:key=Skip-Android-CI,valueonly)', head],
                      text=True,
                  ).strip().lower() == 'true'
                  if skip_requested:
                      changed = False
                      print('::notice::Android tests and builds skipped by the HEAD commit trailer')
                  elif event == 'workflow_dispatch' or not base.strip('0'):
                      changed = True
                  else:
                      if event == 'pull_request':
                          base = subprocess.check_output(['git', 'merge-base', base, head], text=True).strip()
                      paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, head]).decode().split('\0')
                      changed = any(
                          path.startswith(('android/', 'shared/fixtures/'))
                          and not path.lower().endswith(('.md', '.mdx'))
                          for path in paths
                      )
                  value = str(changed).lower()
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write(f'android={value}\n')
                  print(f'Run Android tests and builds: {value}')
                  PY

    build:
        needs: changes
        if: needs.changes.outputs.android == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        defaults:
            run:
                shell: bash
                working-directory: android
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'
            # Android SDK is preinstalled on GitHub ubuntu runners (licenses
            # accepted); AGP auto-installs any missing platform/build-tools.
            - uses: gradle/actions/setup-gradle@v5
            # Check every Kotlin source set before spending time on tests or emulators.
            # --continue reports independent compilation failures in this one run.
            - name: Compile app, unit tests and instrumentation tests
              run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin --continue --console=plain 2>&1 | tee compile.log
            - name: Protocol, data and app unit tests and lint
              run: ./gradlew :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --continue --console=plain 2>&1 | tee unit-lint.log
            - name: Assemble verified debug APKs
              run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee assemble.log
            - name: Annotate build failures
              if: failure()
              run: |
                  python3 - <<'PYTHON'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  def escape(value):
                      return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

                  for log in (Path('compile.log'), Path('unit-lint.log'), Path('assemble.log')):
                      if not log.exists():
                          continue
                      for line in log.read_text(errors='replace').splitlines():
                          if line.startswith('e: ') or ' FAILED' in line:
                              print('::error::' + escape(line))

                  report = Path('app/build/reports/lint-results-debug.xml')
                  if report.exists():
                      findings = []
                      for issue in ET.parse(report).getroot().findall('issue'):
                          if issue.get('severity') not in ('Error', 'Fatal'):
                              continue
                          location = issue.find('location')
                          source = '' if location is None else f"{location.get('file', '')}:{location.get('line', '1')}\n"
                          detail = f"{issue.get('id', 'Lint')}: {issue.get('message', '')}"
                          findings.append(source + detail)
                      # Actions limits error annotations per step; retain every lint finding.
                      if findings:
                          print('::error::' + escape('\n\n'.join(findings)))
                  PYTHON
            - name: Upload unit and lint reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: android-unit-lint-reports
                  path: |
                      android/**/build/reports/tests/
                      android/**/build/test-results/
                      android/app/build/reports/lint-results-debug.*
                      android/*.log
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Upload debug APK
              uses: actions/upload-artifact@v6
              with:
                  name: hapi-android-debug-${{ github.sha }}
                  path: android/app/build/outputs/apk/debug/*.apk
                  if-no-files-found: error
                  retention-days: 7

    transcript-layout:
        # A compile/test/lint failure must not boot any emulator.
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        strategy:
            fail-fast: true
            max-parallel: 1
            matrix:
                api-level: [36]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v5
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ matrix.api-level }}
                  arch: x86_64
                  disable-animations: true
                  # Real MainActivity/background lifecycle coverage runs in a
                  # separate instrumentation process from Compose layout tests.
                  script: |
                      cd android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=app.hapi.companion.feature.chat.BackgroundNotificationDeliveryTest --stacktrace
                      mkdir -p android/build/ci-transcript-reports android/build/ci-transcript-results
                      cp -R android/app/build/reports/androidTests/. android/build/ci-transcript-reports/
                      cp -R android/app/build/outputs/androidTest-results/. android/build/ci-transcript-results/
                      cd android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.hapi.companion.feature.chat.BackgroundNotificationDeliveryTest --stacktrace
            - name: Annotate instrumentation failures
              if: failure()
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  def escape(value):
                      return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

                  for report in Path('android/app/build/outputs/androidTest-results').rglob('*.xml'):
                      try:
                          root = ET.parse(report).getroot()
                      except ET.ParseError:
                          continue
                      for case in root.iter('testcase'):
                          for failure in list(case.findall('failure')) + list(case.findall('error')):
                              title = case.get('classname', '') + '.' + case.get('name', '')
                              detail = failure.get('message', '') + '\n' + (failure.text or '')
                              print('::error::' + escape(title + '\n' + detail[:12000]))
                  PY
            - name: Upload instrumentation reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: android-test-reports-api-${{ matrix.api-level }}
                  path: |
                      android/app/build/reports/androidTests/
                      android/app/build/outputs/androidTest-results/
                      android/build/ci-transcript-reports/
                      android/build/ci-transcript-results/
                  if-no-files-found: ignore
                  retention-days: 7
